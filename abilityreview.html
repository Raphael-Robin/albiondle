<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albiondle — Ability Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#070d11; --void2:#0b141a; --panel:#0e1a20; --line:#1d2f38; --line-soft:#152128;
  --text:#dfeef0; --mist:#7f9aa2; --portal:#4fd6c4; --portal-dim:rgba(79,214,196,.14);
  --brass:#cba14e; --brass-lite:#e6c883; --good:#4fd6a0; --bad:#e6866a;
  --display:'Cinzel',serif; --body:'Barlow',sans-serif; --mono:'Space Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 70% -10%,#0d1c22,var(--void)) fixed;color:var(--text);
  font-family:var(--body);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
button{font-family:var(--body);cursor:pointer}
::selection{background:var(--portal-dim)}

/* top bar */
header{display:flex;align-items:center;gap:18px;padding:12px 20px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--void2),transparent);flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.06em;color:var(--brass-lite);font-size:17px;white-space:nowrap}
.brand span{color:var(--portal)}
.stat{font-family:var(--mono);font-size:11.5px;color:var(--mist);letter-spacing:.04em}
.stat b{color:var(--text)}
.stat .flag{color:var(--brass-lite)}
.spacer{flex:1}
.btn{background:transparent;border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:600;
  padding:8px 14px;border-radius:8px;transition:.15s}
.btn:hover{border-color:var(--portal);color:var(--portal)}
.btn.primary{background:var(--portal);color:#04211d;border-color:var(--portal)}
.btn.primary:hover{background:var(--brass-lite);border-color:var(--brass-lite);color:#241a05}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* layout */
main{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:rgba(7,13,17,.5)}
.searchwrap{padding:12px}
#search{width:100%;background:var(--void);border:1px solid var(--line);color:var(--text);font-family:var(--body);
  font-size:14px;padding:8px 11px;border-radius:8px;outline:none}
#search:focus{border-color:var(--portal);box-shadow:0 0 0 3px var(--portal-dim)}
.filters{display:flex;gap:6px;padding:0 12px 10px}
.filters button{flex:1;background:transparent;border:1px solid var(--line);color:var(--mist);font-size:11px;
  font-family:var(--mono);letter-spacing:.03em;padding:6px 4px;border-radius:6px}
.filters button.on{border-color:var(--portal);color:var(--portal);background:var(--portal-dim)}
.list{overflow-y:auto;flex:1;padding:0 6px 12px}
.row{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.row:hover{background:var(--void2)}
.row.active{background:var(--panel);border-color:var(--line)}
.row .ic{width:26px;height:26px;border-radius:6px;background:#0a151a;flex:none;object-fit:cover}
.row .nm{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .dot{width:7px;height:7px;border-radius:50%;flex:none}
.row .seen{background:var(--line)}
.row .flagged{background:var(--brass);box-shadow:0 0 6px var(--brass)}
.row.isflagged .nm{color:var(--brass-lite)}

/* card */
.scroll{overflow-y:auto;min-height:0}
.card{max-width:760px;margin:0 auto;padding:26px 30px 60px}
.nav{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.nav .idx{font-family:var(--mono);font-size:12px;color:var(--mist);min-width:96px;text-align:center}
.head{display:flex;gap:20px;align-items:center;margin-bottom:22px}
.head .icon{width:84px;height:84px;border-radius:14px;background:#0a151a;border:1px solid var(--line);
  object-fit:cover;flex:none}
.head .icon.err{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:var(--mist)}
.head h1{font-family:var(--display);font-weight:600;font-size:27px;margin:0 0 4px;letter-spacing:.01em}
.head .sub{font-family:var(--mono);font-size:12px;color:var(--mist);letter-spacing:.04em}
.head .sub b{color:var(--portal)}

.attrs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);
  border-radius:12px;overflow:hidden;margin-bottom:20px}
.attr{background:var(--panel);padding:12px 15px}
.attr.full{grid-column:1/-1}
.attr .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);margin-bottom:6px}
.attr .v{font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--void);border:1px solid var(--line);color:var(--text)}
.chip.on{border-color:var(--portal);color:var(--portal)}
.muted{color:var(--mist)}
.desc{font-size:14.5px;line-height:1.6;color:#cfe2e4}
details.raw{margin-top:14px}
details.raw summary{font-family:var(--mono);font-size:11px;color:var(--mist);cursor:pointer;letter-spacing:.05em}
details.raw pre{background:var(--void);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;
  font-family:var(--mono);font-size:11.5px;color:var(--mist);margin-top:8px}

/* flag panel */
.flagbox{border:1px solid var(--brass);border-radius:12px;padding:16px 18px;background:linear-gradient(180deg,rgba(203,161,78,.06),transparent)}
.flagbox h3{font-family:var(--display);font-size:16px;color:var(--brass-lite);margin:0 0 12px;letter-spacing:.02em}
.flagform{display:grid;grid-template-columns:170px 1fr auto;gap:10px;align-items:start}
.flagform select,.flagform textarea{background:var(--void);border:1px solid var(--line);color:var(--text);
  font-family:var(--body);font-size:13.5px;padding:8px 10px;border-radius:8px;outline:none;width:100%}
.flagform select:focus,.flagform textarea:focus{border-color:var(--brass);box-shadow:0 0 0 3px rgba(203,161,78,.15)}
.flagform textarea{min-height:38px;resize:vertical;line-height:1.4}
.flagform .add{background:var(--brass);color:#241a05;border:1px solid var(--brass);font-weight:700;font-size:13px;
  padding:8px 14px;border-radius:8px;height:38px}
.flagform .add:hover{background:var(--brass-lite)}
.flaglist{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.fitem{display:flex;gap:10px;align-items:flex-start;background:var(--void);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px}
.fitem .fld{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass-lite);
  background:rgba(203,161,78,.1);padding:2px 8px;border-radius:5px;white-space:nowrap;margin-top:1px}
.fitem .txt{flex:1;font-size:13.5px;color:#dfeef0}
.fitem .del{background:none;border:none;color:var(--mist);font-size:16px;line-height:1;padding:0 2px}
.fitem .del:hover{color:var(--bad)}

/* empty / loader */
.empty{max-width:520px;margin:8vh auto;text-align:center;padding:0 20px}
.empty h2{font-family:var(--display);font-weight:600;color:var(--brass-lite);font-size:24px;margin:0 0 10px}
.empty p{color:var(--mist);font-size:14.5px;margin:0 0 22px}
.hidden{display:none!important}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--panel);border:1px solid var(--portal);color:var(--text);padding:11px 20px;border-radius:10px;
  font-size:13.5px;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
kbd{font-family:var(--mono);font-size:11px;background:var(--void);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--mist)}
@media(max-width:820px){main{grid-template-columns:1fr}aside{display:none}.flagform{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="brand">Albiondle <span>·</span> Ability Review</div>
  <div class="stat">reviewed <b id="stSeen">0</b>/<b id="stTotal">0</b></div>
  <div class="stat">flagged <b class="flag" id="stFlagged">0</b></div>
  <div class="spacer"></div>
  <button class="btn" id="btnNextUnseen" title="Jump to the next ability you haven't opened yet">Next unreviewed</button>
  <label class="btn" for="file">Load abilities.json</label>
  <input id="file" type="file" accept=".json,application/json" class="hidden">
  <button class="btn primary" id="btnExport">Export flags</button>
</header>

<main>
  <aside>
    <div class="searchwrap"><input id="search" type="text" placeholder="Search abilities…" autocomplete="off"></div>
    <div class="filters">
      <button data-filter="all" class="on">All</button>
      <button data-filter="flagged">Flagged</button>
      <button data-filter="unseen">Unseen</button>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <div class="scroll">
    <div id="emptyState" class="empty">
      <h2>Load your ability data</h2>
      <p>Pick your <b>abilities.json</b> file to start reviewing. Everything runs locally in your browser — nothing is uploaded. Your flags are saved automatically so you can stop and come back.</p>
      <label class="btn primary" for="file">Load abilities.json</label>
    </div>

    <div id="cardWrap" class="card hidden">
      <div class="nav">
        <button class="btn" id="prev">← Prev</button>
        <div class="idx" id="idxLabel">0 / 0</div>
        <button class="btn" id="next">Next →</button>
        <div class="spacer"></div>
        <div class="stat muted">use <kbd>←</kbd> <kbd>→</kbd> to move</div>
      </div>

      <div class="head">
        <img class="icon" id="cIcon" alt="">
        <div>
          <h1 id="cName">—</h1>
          <div class="sub" id="cSub"></div>
        </div>
      </div>

      <div class="attrs" id="cAttrs"></div>

      <div class="flagbox">
        <h3>Flag wrong data</h3>
        <div class="flagform">
          <select id="fField">
            <option value="Name">Name</option>
            <option value="Type / line / piece">Type / line / piece</option>
            <option value="Tags">Tags</option>
            <option value="Damage type">Damage type</option>
            <option value="Buffs">Buffs</option>
            <option value="Debuffs">Debuffs</option>
            <option value="Immunity">Immunity</option>
            <option value="Crowd control">Crowd control</option>
            <option value="Cooldown">Cooldown</option>
            <option value="Scales with IP">Scales with IP</option>
            <option value="Cast type">Cast type</option>
            <option value="Targeting">Targeting</option>
            <option value="Description">Description</option>
            <option value="Icon">Icon</option>
            <option value="Other">Other</option>
          </select>
          <textarea id="fNote" placeholder="What's wrong, and what it should be…"></textarea>
          <button class="add" id="fAdd">Add flag</button>
        </div>
        <div class="flaglist" id="flagList"></div>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const ICON = id => `https://render.albiononline.com/v1/spell/${id}.png`;
const LS_FLAGS = 'albiondle_review_flags';
const LS_SEEN  = 'albiondle_review_seen';

let ABIL = [];          // all abilities
let view = [];          // filtered indices into ABIL
let cur = 0;            // position within ABIL (absolute index)
let flags = {};         // id -> [ {field, note} ]
let seen = {};          // id -> true
let filter = 'all';
let search = '';

/* ---------- persistence ---------- */
function load(){ try{flags=JSON.parse(localStorage.getItem(LS_FLAGS)||'{}');}catch(e){flags={};}
                try{seen=JSON.parse(localStorage.getItem(LS_SEEN)||'{}');}catch(e){seen={};} }
function saveFlags(){ try{localStorage.setItem(LS_FLAGS,JSON.stringify(flags));}catch(e){} }
function saveSeen(){ try{localStorage.setItem(LS_SEEN,JSON.stringify(seen));}catch(e){} }

/* ---------- data loading ---------- */
function setData(arr){
  ABIL = arr.slice().sort((a,b)=>a.n.localeCompare(b.n));
  $('#emptyState').classList.add('hidden');
  $('#cardWrap').classList.remove('hidden');
  $('#stTotal').textContent = ABIL.length;
  cur = 0; applyFilter(); goto(view.length?view[0]:0); refreshStats();
}
$('#file').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try{ const d = JSON.parse(r.result);
      if(!Array.isArray(d)) throw 0; setData(d); toast(`Loaded ${d.length} abilities`); }
    catch(err){ toast('That file is not a valid abilities.json'); } };
  r.readAsText(f);
});
// best-effort auto-load if served next to this file
fetch('abilities.json').then(r=>r.ok?r.json():null).then(d=>{ if(d&&Array.isArray(d)&&!ABIL.length) setData(d); }).catch(()=>{});

/* ---------- rendering ---------- */
function flagCount(id){ return (flags[id]||[]).length; }

function renderList(){
  const el = $('#list'); el.innerHTML='';
  view.forEach(i=>{
    const a = ABIL[i];
    const row = document.createElement('div');
    row.className = 'row' + (i===cur?' active':'') + (flagCount(a.id)?' isflagged':'');
    row.innerHTML =
      `<img class="ic" src="${ICON(a.id)}" onerror="this.style.visibility='hidden'" alt="">
       <span class="nm">${a.n}</span>
       <span class="dot ${flagCount(a.id)?'flagged':(seen[a.id]?'seen':'')}"></span>`;
    row.onclick = ()=>goto(i);
    el.appendChild(row);
  });
}

function attrRow(k, vHtml, full){
  return `<div class="attr${full?' full':''}"><div class="k">${k}</div><div class="v">${vHtml}</div></div>`;
}
function chips(arr){ return arr && arr.length
  ? `<div class="chips">${arr.map(x=>`<span class="chip on">${x}</span>`).join('')}</div>`
  : `<span class="muted">—</span>`; }

function renderCard(){
  const a = ABIL[cur]; if(!a) return;
  $('#idxLabel').textContent = `${cur+1} / ${ABIL.length}`;
  const img = $('#cIcon'); img.classList.remove('err'); img.src = ICON(a.id);
  img.onerror = ()=>{ img.removeAttribute('src'); img.classList.add('err'); img.textContent='no icon'; };
  $('#cName').textContent = a.n;
  const where = a.t==='w' ? `<b>${a.l||'?'}</b> weapon` : `<b>${a.p||'Armor'}</b>`;
  $('#cSub').innerHTML = `${where} &nbsp;·&nbsp; id ${a.id}`;

  const rows = [
    attrRow('Tags', chips(a.tags)),
    attrRow('Damage type', chips(a.dmg)),
    attrRow('Buffs', chips(a.bf)),
    attrRow('Debuffs', chips(a.db)),
    attrRow('Immunity', chips(a.imm)),
    attrRow('Crowd control', chips(a.cc)),
    attrRow('Cast type', a.ct?`<span class="chip on">${a.ct}</span>`:'<span class="muted">—</span>'),
    attrRow('Targeting', a.cr?`<span class="chip on">${a.cr}</span>`:'<span class="muted">—</span>'),
    attrRow('Cooldown', `${a.cd}s`),
    attrRow('Scales with IP', a.ip?'Yes':'No'),
    attrRow('Description', `<span class="desc">${a.desc||'<span class="muted">—</span>'}</span>`
      + `<details class="raw"><summary>raw record</summary><pre>${JSON.stringify(a,null,2)}</pre></details>`, true),
  ];
  $('#cAttrs').innerHTML = rows.join('');
  renderFlags();
  renderList();
  if(!seen[a.id]){ seen[a.id]=true; saveSeen(); refreshStats(); }
}

function renderFlags(){
  const a = ABIL[cur]; const list = flags[a.id]||[];
  const el = $('#flagList');
  el.innerHTML = list.map((f,i)=>
    `<div class="fitem"><span class="fld">${f.field}</span><span class="txt">${escapeHtml(f.note)}</span>
     <button class="del" data-i="${i}" title="Remove">×</button></div>`).join('');
  el.querySelectorAll('.del').forEach(b=>b.onclick=()=>{ list.splice(+b.dataset.i,1);
    if(!list.length) delete flags[a.id]; saveFlags(); renderFlags(); renderList(); refreshStats(); });
}

/* ---------- flag add ---------- */
$('#fAdd').onclick = addFlag;
$('#fNote').addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) addFlag(); });
function addFlag(){
  const a = ABIL[cur]; const note = $('#fNote').value.trim();
  if(!note){ toast('Add a short note describing the issue'); $('#fNote').focus(); return; }
  (flags[a.id] = flags[a.id]||[]).push({ field: $('#fField').value, note });
  $('#fNote').value=''; saveFlags(); renderFlags(); renderList(); refreshStats();
  toast('Flag added');
}

/* ---------- navigation ---------- */
function goto(i){ if(i<0||i>=ABIL.length) return; cur=i; renderCard();
  const active=$('.row.active'); if(active) active.scrollIntoView({block:'nearest'});
  $('.scroll').scrollTop=0; }
function step(d){
  // move within the current filtered view
  const pos = view.indexOf(cur);
  if(pos===-1){ if(view.length) goto(view[0]); return; }
  const np = pos+d; if(np>=0 && np<view.length) goto(view[np]);
}
$('#prev').onclick=()=>step(-1);
$('#next').onclick=()=>step(1);
$('#btnNextUnseen').onclick=()=>{
  const start = view.indexOf(cur);
  for(let k=1;k<=view.length;k++){ const i=view[(start+k)%view.length]; if(!seen[ABIL[i].id]){ goto(i); return; } }
  toast('All abilities in this view have been opened');
};
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.key==='ArrowLeft') step(-1);
  else if(e.key==='ArrowRight') step(1);
});

/* ---------- filter / search ---------- */
function applyFilter(){
  view = ABIL.map((a,i)=>i).filter(i=>{
    const a=ABIL[i];
    if(search && !a.n.toLowerCase().includes(search) && !a.id.toLowerCase().includes(search)) return false;
    if(filter==='flagged') return flagCount(a.id)>0;
    if(filter==='unseen')  return !seen[a.id];
    return true;
  });
  renderList();
}
$('#search').addEventListener('input', e=>{ search=e.target.value.toLowerCase().trim(); applyFilter(); });
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); filter=b.dataset.filter; applyFilter();
});

/* ---------- stats ---------- */
function refreshStats(){
  $('#stSeen').textContent = ABIL.filter(a=>seen[a.id]).length;
  $('#stFlagged').textContent = Object.values(flags).reduce((n,l)=>n+l.length,0);
  if(filter!=='all') applyFilter();
}

/* ---------- export ---------- */
$('#btnExport').onclick = exportFlags;
function exportFlags(){
  const items = [];
  ABIL.forEach(a=>(flags[a.id]||[]).forEach(f=>items.push({id:a.id,name:a.n,field:f.field,note:f.note})));
  if(!items.length){ toast('No flags to export yet'); return; }
  // readable text
  const text = `Albiondle ability flags — ${items.length} issue(s)\n\n` +
    items.map(f=>`• ${f.name} [${f.id}] — ${f.field}: ${f.note}`).join('\n');
  // json
  const blob = new Blob([JSON.stringify(items,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob); const link=document.createElement('a');
  link.href=url; link.download='albiondle-flags.json'; link.click(); URL.revokeObjectURL(url);
  // copy text too
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(
    ()=>toast(`Exported ${items.length} flags (file downloaded + copied to clipboard)`),
    ()=>toast(`Exported ${items.length} flags (file downloaded)`));
  else toast(`Exported ${items.length} flags (file downloaded)`);
}

/* ---------- utils ---------- */
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

load();
</script>
</body>
</html>
