<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Albiondle — Outland Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0a1116; --void2:#0d181e; --fog:#122029; --raise:#162831;
  --line:#274850; --line-soft:#1c343c;
  --portal:#4fd6c4; --portal-dim:rgba(79,214,196,.14); --portal-glow:rgba(79,214,196,.55);
  --brass:#cba14e; --brass-lite:#e8c977;
  --parch:#e8d9b6; --parch-shade:#d8c39a; --ink:#241c10;
  --blood:#cf5a3d; --mist:#7f9aa1; --text:#e2edee;
  --display:'Cinzel',serif; --body:'Barlow',sans-serif; --mono:'Space Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:
    radial-gradient(1200px 700px at 78% -8%, rgba(79,214,196,.10), transparent 60%),
    radial-gradient(900px 600px at 10% 110%, rgba(203,161,78,.07), transparent 55%),
    var(--void);
  color:var(--text); font-family:var(--body); line-height:1.45;
  min-height:100vh; padding:28px 18px 60px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px; margin:0 auto}

/* header */
.top{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:22px}
.brandmark{display:flex; align-items:center; gap:14px}
.seal{width:44px; height:44px; flex:none}
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.32em; color:var(--portal); text-transform:uppercase; margin:0 0 2px}
h1{font-family:var(--display); font-weight:700; font-size:30px; letter-spacing:.06em; margin:0; color:var(--brass-lite)}
.tagline{font-size:13.5px; color:var(--mist); margin:3px 0 0; max-width:34ch}

/* difficulty */
.diff{display:flex; flex-direction:column; align-items:flex-end; gap:7px}
.diff .lab{font-family:var(--mono); font-size:10px; letter-spacing:.28em; color:var(--mist); text-transform:uppercase}
.diff .row{display:flex; gap:4px}
.diff button{
  width:30px; height:30px; border:1px solid var(--line); background:var(--void2); color:var(--mist);
  font-family:var(--mono); font-size:13px; border-radius:5px; cursor:pointer; transition:.15s;
}
.diff button:hover{border-color:var(--portal); color:var(--text)}
.diff button[aria-pressed="true"]{background:var(--portal); border-color:var(--portal); color:#04211d; font-weight:700}

/* panel */
.panel{
  background:linear-gradient(180deg,var(--void2),#0b141a);
  border:1px solid var(--line-soft); border-radius:14px; overflow:hidden;
  box-shadow:0 24px 60px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.02);
}
.sect{padding:20px 22px}
.sect + .sect{border-top:1px solid var(--line-soft)}
.label{font-family:var(--mono); font-size:10.5px; letter-spacing:.28em; text-transform:uppercase; color:var(--mist); margin:0 0 12px}

/* start map card (parchment) */
.origin{
  display:flex; align-items:center; gap:16px;
  background:linear-gradient(155deg,var(--parch),var(--parch-shade));
  color:var(--ink); border-radius:10px; padding:16px 18px;
  border:1px solid #b49b6c; box-shadow:inset 0 2px 5px rgba(255,255,255,.35), 0 8px 22px -14px #000;
  position:relative;
}
.origin::after{content:""; position:absolute; inset:0; border-radius:10px; pointer-events:none;
  background:radial-gradient(120% 120% at 90% 10%, transparent 60%, rgba(90,66,20,.14))}
.pin{width:26px;height:26px;flex:none;color:#7a5a1c}
.origin .name{font-family:var(--display); font-weight:600; font-size:23px; line-height:1.1; letter-spacing:.01em}
.origin .meta{margin-top:3px; font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:#6c5426}
.origin .meta b{color:#4f3d16; font-weight:700}

/* hero: compass + route */
.hero{display:grid; grid-template-columns:150px 1fr; gap:22px; align-items:center}
.compass{width:150px; height:150px; margin:0 auto}
.spoke{transition:opacity .3s, filter .3s; opacity:.16}
.spoke.lit{opacity:1; filter:drop-shadow(0 0 6px var(--portal-glow))}
.rose-ring{fill:none; stroke:var(--line); stroke-width:1.2}
.rose-card{fill:none; stroke:var(--brass); stroke-width:1; opacity:.5}
.rose-lbl{font-family:var(--mono); font-size:8.5px; fill:var(--mist); letter-spacing:.1em}

.route{display:flex; flex-wrap:wrap; gap:0; align-items:flex-start}
.wp{display:flex; flex-direction:column; align-items:center; gap:6px; position:relative; min-width:58px}
.wp .diamond{
  width:44px;height:44px; transform:rotate(45deg); border:1.5px solid var(--line);
  background:var(--fog); display:grid; place-items:center; border-radius:8px; transition:.18s; cursor:default;
}
.wp .diamond span{transform:rotate(-45deg); font-family:var(--mono); font-weight:700; font-size:13px; color:var(--portal)}
.wp.active .diamond{border-color:var(--portal); background:var(--portal-dim); box-shadow:0 0 0 3px var(--portal-dim)}
.wp .ord{font-family:var(--mono); font-size:9px; color:var(--mist); letter-spacing:.1em}
.wp .stop{font-family:var(--display); font-size:11.5px; color:var(--brass-lite); text-align:center; max-width:82px;
  line-height:1.15; opacity:0; height:0; overflow:hidden; transition:opacity .3s}
.route.revealed .wp .stop{opacity:1; height:auto; margin-top:2px}
.arrow{align-self:center; margin-top:16px; color:var(--line); flex:none}
.route.revealed .arrow{margin-top:8px}

/* arrival / input */
.field{position:relative}
.combo{display:flex; gap:10px}
input#guess{
  flex:1; background:var(--void); border:1px solid var(--line); color:var(--text);
  font-family:var(--display); font-size:18px; padding:13px 15px; border-radius:9px; outline:none; transition:.15s;
}
input#guess::placeholder{font-family:var(--body); font-size:15px; color:#5f7a80}
input#guess:focus{border-color:var(--portal); box-shadow:0 0 0 3px var(--portal-dim)}
.field.wrong input#guess{border-color:var(--blood); animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.acx{position:absolute; z-index:20; top:calc(100% + 6px); left:0; right:120px;
  background:#0b151b; border:1px solid var(--line); border-radius:9px; overflow:hidden; display:none;
  box-shadow:0 20px 40px -18px #000}
.acx.open{display:block}
.acx div{padding:9px 14px; font-family:var(--display); font-size:15px; cursor:pointer; border-bottom:1px solid var(--line-soft)}
.acx div:last-child{border-bottom:0}
.acx div .b{font-size:10px; font-family:var(--mono); color:var(--mist); float:right; margin-top:3px}
.acx div.sel,.acx div:hover{background:var(--portal-dim); color:var(--brass-lite)}

/* buttons */
.btns{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
button.act{font-family:var(--body); font-weight:600; font-size:14px; padding:11px 18px; border-radius:9px; cursor:pointer; border:1px solid transparent; transition:.15s}
button.primary{background:var(--portal); color:#04211d; border-color:var(--portal)}
button.primary:hover{background:var(--brass-lite); border-color:var(--brass-lite)}
button.ghost{background:transparent; color:var(--mist); border-color:var(--line)}
button.ghost:hover{color:var(--text); border-color:var(--portal)}
button:focus-visible{outline:2px solid var(--brass); outline-offset:2px}

/* result + score */
.result{min-height:24px; margin-top:14px; font-size:15px; font-weight:500}
.result.win{color:var(--portal)}
.result.miss{color:var(--blood)}
.result.rev{color:var(--brass-lite)}
.score{display:flex; gap:22px; margin-top:6px; font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--mist); text-transform:uppercase}
.score b{color:var(--brass-lite)}
.foot{text-align:center; margin-top:22px; font-size:12px; color:#4c6168; font-family:var(--mono); letter-spacing:.05em}
.foot a{color:var(--mist)}

@media (max-width:560px){
  h1{font-size:25px}
  .hero{grid-template-columns:1fr; gap:14px}
  .compass{width:120px;height:120px}
  .acx{right:0}
  .combo{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>

const NAMES = ZONES.map((z,i)=>({i, n:z.n, low:z.n.toLowerCase(), t:z.t, b:z.b}));
const OPP = {NE:'SW',SW:'NE',NW:'SE',SE:'NW'};
const MAXD = 8, DIRS=['NW','NE','SE','SW'];

let state = { diff:3, start:0, dirs:[], stops:[], answer:0, done:false, guesses:0 };
let score = { streak:0, best:0, solved:0 };

/* ---------- puzzle generation ---------- */
function genPuzzle(diff){
  for(let tries=0; tries<4000; tries++){
    let cur = Math.floor(Math.random()*ZONES.length);
    let start = cur, prev=null, dirs=[], stops=[cur], ok=true;
    for(let s=0;s<diff;s++){
      const opts = Object.keys(ZONES[cur].d).filter(dr=>dr!==prev);
      if(!opts.length){ ok=false; break; }
      const dr = opts[Math.floor(Math.random()*opts.length)];
      cur = ZONES[cur].d[dr]; prev = OPP[dr]; dirs.push(dr); stops.push(cur);
    }
    if(ok) return {start, dirs, stops, answer:cur};
  }
  return null;
}

/* ---------- render ---------- */
function render(){
  const z = ZONES[state.start];
  document.getElementById('startName').textContent = z.n;
  document.getElementById('startMeta').innerHTML = `TIER <b>${z.t}</b> &nbsp;·&nbsp; <b>${z.b||'—'}</b>`;

  const route = document.getElementById('route'); route.innerHTML=''; route.className='route';
  state.dirs.forEach((dr,idx)=>{
    if(idx>0){
      const a=document.createElementNS('http://www.w3.org/2000/svg','svg');
      a.setAttribute('viewBox','0 0 24 24'); a.setAttribute('class','arrow'); a.setAttribute('width','20'); a.setAttribute('height','20');
      a.innerHTML='<path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
      route.appendChild(a);
    }
    const wp=document.createElement('div'); wp.className='wp';
    wp.innerHTML=`<span class="ord">${String(idx+1).padStart(2,'0')}</span>
      <div class="diamond"><span>${dr}</span></div>
      <div class="stop">${ZONES[state.stops[idx+1]].n}</div>`;
    wp.addEventListener('mouseenter',()=>lightSpoke(dr));
    wp.addEventListener('mouseleave',()=>lightSpoke(null));
    route.appendChild(wp);
  });

  document.getElementById('guess').value='';
  document.getElementById('guess').disabled=false;
  document.getElementById('confirm').disabled=false;
  document.getElementById('result').textContent=''; document.getElementById('result').className='result';
  document.getElementById('field')?.classList.remove('wrong');
  closeAc();
  animateRoute();
}

function lightSpoke(dr){
  DIRS.forEach(d=>document.getElementById('sp-'+d).classList.toggle('lit', d===dr));
}
let animTimer=null;
function animateRoute(){
  if(animTimer) clearTimeout(animTimer);
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  const wps=[...document.querySelectorAll('.wp')];
  wps.forEach(w=>w.classList.remove('active'));
  if(reduce){ lightSpoke(null); return; }
  let i=0;
  (function step(){
    wps.forEach(w=>w.classList.remove('active'));
    if(i<state.dirs.length){
      wps[i].classList.add('active'); lightSpoke(state.dirs[i]);
      i++; animTimer=setTimeout(step, 620);
    } else { lightSpoke(null); }
  })();
}

function norm(s){return s.toLowerCase().replace(/\s+/g,' ').trim();}
function openAc(){
  const q=norm(gi.value);
  if(!q){ closeAc(); return; }
  const starts=[], contains=[];
  for(const it of NAMES){
    const p=it.low.indexOf(q);
    if(p===0) starts.push(it); else if(p>0) contains.push(it);
  }
  acItems=[...starts,...contains].slice(0,8); acSel=-1;
  if(!acItems.length){ closeAc(); return; }
  acx.innerHTML=acItems.map((it,k)=>`<div data-k="${k}" role="option">${it.n}<span class="b">T${it.t} · ${it.b||''}</span></div>`).join('');
  acx.classList.add('open');
  [...acx.children].forEach(ch=>{
    ch.addEventListener('mousedown',e=>{e.preventDefault(); pick(+ch.dataset.k);});
  });
}
function closeAc(){acx.classList.remove('open'); acItems=[]; acSel=-1;}
function pick(k){ gi.value=acItems[k].n; closeAc(); gi.focus(); }
function moveSel(d){
  if(!acItems.length) return;
  acSel=(acSel+d+acItems.length)%acItems.length;
  [...acx.children].forEach((c,i)=>c.classList.toggle('sel',i===acSel));
}
gi.addEventListener('input',()=>{ if(!state.done) openAc(); });
gi.addEventListener('keydown',e=>{
  if(acx.classList.contains('open')){
    if(e.key==='ArrowDown'){e.preventDefault(); moveSel(1); return;}
    if(e.key==='ArrowUp'){e.preventDefault(); moveSel(-1); return;}
    if(e.key==='Escape'){closeAc(); return;}
    if(e.key==='Tab' && acItems.length){e.preventDefault(); pick(acSel>=0?acSel:0); return;}
    if(e.key==='Enter'){ if(acSel>=0){e.preventDefault(); pick(acSel); return;} }
  }
  if(e.key==='Enter'){ e.preventDefault(); checkAnswer(); }
});
document.addEventListener('click',e=>{ if(!e.target.closest('.field')) closeAc(); });

/* ---------- check / reveal ---------- */
function finishGates(){ // reveal intermediate stops on the ribbon
  document.getElementById('route').classList.add('revealed');
  [...document.querySelectorAll('.wp')].forEach(w=>w.classList.remove('active'));
  lightSpoke(null);
}
function checkAnswer(){
  if(state.done) return;
  const g=norm(gi.value);
  if(!g) return;
  state.guesses++;
  if(g===norm(ZONES[state.answer].n)){
    state.done=true; closeAc();
    finishGates();
    const r=document.getElementById('result'); r.className='result win';
    r.textContent=`Arrived. ${ZONES[state.answer].n} is exactly where those gates lead.`;
    score.solved++; score.streak++; score.best=Math.max(score.best,score.streak);
    gi.disabled=true; document.getElementById('confirm').disabled=true;
    updateScore();
  } else {
    const f=gi.closest('.field'); f.classList.add('wrong'); setTimeout(()=>f.classList.remove('wrong'),340);
    const r=document.getElementById('result'); r.className='result miss';
    const known = NAMES.some(n=>n.low===g);
    r.textContent = known ? 'Not there — retrace the gates and try again.'
                          : 'No map by that name. Use the suggestions to pick a valid map.';
  }
}
function giveUp(){
  if(state.done) return;
  state.done=true; closeAc(); finishGates();
  const r=document.getElementById('result'); r.className='result rev';
  r.textContent=`The route ends at ${ZONES[state.answer].n}.`;
  score.streak=0; updateScore();
  gi.disabled=true; document.getElementById('confirm').disabled=true;
}
function updateScore(){
  document.getElementById('sStreak').textContent=score.streak;
  document.getElementById('sBest').textContent=score.best;
  document.getElementById('sSolved').textContent=score.solved;
}

/* ---------- new route / difficulty ---------- */
function newRoute(){
  const p=genPuzzle(state.diff);
  if(!p){ return; }
  state.start=p.start; state.dirs=p.dirs; state.stops=p.stops; state.answer=p.answer;
  state.done=false; state.guesses=0;
  render(); gi.focus();
}
function buildDiff(){
  const row=document.getElementById('diffRow');
  for(let d=1; d<=MAXD; d++){
    const b=document.createElement('button'); b.textContent=d; b.setAttribute('aria-pressed', d===state.diff);
    b.addEventListener('click',()=>{ state.diff=d; [...row.children].forEach(c=>c.setAttribute('aria-pressed', +c.textContent===d)); newRoute(); });
    row.appendChild(b);
  }
}

document.getElementById('confirm').addEventListener('click',checkAnswer);
document.getElementById('give').addEventListener('click',giveUp);
document.getElementById('fresh').addEventListener('click',newRoute);
buildDiff(); newRoute();
</script>
</body>
</html>
