name: Deploy to GitHub Pages

on:
  push:
    branches: [main]      # use "master" here if that's your default branch
  workflow_dispatch:       # adds a manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # repo root — where your index.html lives
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4